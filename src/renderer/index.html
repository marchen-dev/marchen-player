<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- <meta http-equiv="Content-Security-Policy" content="script-src 'self';" /> -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    <!-- 在业务模块和监控加载前应用主题，避免空白窗口先闪成白色。 -->
    <script>
      try {
        const theme = localStorage.getItem('theme')
        const dark =
          theme === 'dark' ||
          (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch {}
    </script>
    <style>
      html {
        background: #fafafa;
        color: #262626;
      }
      html.dark {
        background: #121212;
        color: #e5e5e5;
      }
      body {
        margin: 0;
      }
    </style>
    <!-- 网页图标独立于桌面图标，由 scripts/web/generate-favicons.mjs 从 favicon.svg 生成；
         搜索引擎偏好 48 倍数的大尺寸，因此同时提供 SVG 与 192px PNG，ico 仅作旧浏览器兜底。 -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Marchen Player</title>
    <!-- 告诉搜索引擎站点名称，避免搜索结果把站点名显示成根域名 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Marchen Player",
        "url": "https://marchen.suemor.com/"
      }
    </script>
    <!-- 两端共用品牌信息；canonical 与分享地址始终指向正式 Web 入口。 -->
    <meta
      name="description"
      content="Marchen Player 是一款开源动漫弹幕播放器，支持打开本地视频、自动匹配弹幕与加载字幕，提供 Web 和桌面版本。"
    />
    <link rel="canonical" href="https://marchen.suemor.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:site_name" content="Marchen Player" />
    <meta property="og:title" content="Marchen Player - 本地视频弹幕播放器" />
    <meta
      property="og:description"
      content="Marchen Player 是一款开源动漫弹幕播放器，支持打开本地视频、自动匹配弹幕与加载字幕，提供 Web 和桌面版本。"
    />
    <meta property="og:url" content="https://marchen.suemor.com/" />
    <meta property="og:image" content="https://marchen.suemor.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Marchen Player：本地视频弹幕播放器" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Marchen Player - 本地视频弹幕播放器" />
    <meta
      name="twitter:description"
      content="Marchen Player 是一款开源动漫弹幕播放器，支持打开本地视频、自动匹配弹幕与加载字幕，提供 Web 和桌面版本。"
    />
    <meta name="twitter:image" content="https://marchen.suemor.com/og-image.png" />
    <meta name="twitter:image:alt" content="Marchen Player：本地视频弹幕播放器" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
