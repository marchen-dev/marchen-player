releaseNotes: "# Marchen 1.0.5\r

  \r

  ## 网络\r

  \r

  - 新增 API 备用线路，自动模式下请求失败时尝试切换，提高匹配和弹幕加载的可用性。\r

  - 通用设置新增 API 线路选择，支持自动、Cloudflare 和 EdgeOne，并显示当前线路。\r

  - 在线体验地址更新为 https://marchen.suemor.com/。\r

  \r

  ## 播放\r

  \r

  - 修复点击控制栏空白区域后，控制栏无法自动隐藏的问题。\r

  - 提高底部细进度条的颜色对比度。\r

  \r

  ## 界面\r

  \r

  - 调浅弹幕加载步骤的已完成状态配色。\r

  - 将通用设置中的外观分组移至播放上方，简化线路状态说明。\r

  - 播放器首页提示改为“点击或拖拽视频到此处播放”。\r\n"
