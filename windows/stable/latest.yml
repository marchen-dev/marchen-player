releaseNotes: "# Marchen 1.0.2\r

  \r

  ## 影视库\r

  \r

  - 作品卡片支持右键菜单，可快速播放、查看详情、标记全部已看、重置观看进度或移除作品。\r

  - 新增本地与远程来源标记，本地视频可直接在文件管理器中定位。\r

  - 减少返回影视库时的封面闪烁。\r

  \r

  ## 数据管理\r

  \r

  - 设置页展示弹幕缓存、播放缩略图和网络缓存占用，支持分别清理。\r

  - 清理弹幕缓存时保留手动导入和链接添加的弹幕。\r

  - 简化重置应用的确认流程。\r

  \r

  ## 问题反馈\r

  \r

  - 新增应用内反馈入口，播放失败时可直接反馈当前问题。\r

  - 支持随反馈附带诊断日志，方便排查播放、字幕和下载异常。\r

  - 完善运行信息记录与异常排查能力。\r\n"
