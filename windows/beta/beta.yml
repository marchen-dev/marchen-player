releaseNotes: "# Marchen 1.0.0\r

  \r

  Marchen 1.0.0 正式发布。拖入动漫视频即可自动匹配弹幕，也可以通过影视库继续观看，或下载完成后直接播放。\r

  \r

  ## 播放与弹幕\r

  \r

  - 支持原生与兼容播放内核、音轨切换、内嵌字幕及外挂字幕。\r

  - 自动匹配动漫弹幕，支持手动重新匹配、导入本地弹幕及添加链接弹幕。\r

  - 匹配等待期间可直接播放，弹幕加载失败后支持重试。\r

  - 点击弹幕即可复制内容。\r

  - 影视库保存播放记录与进度，方便继续观看。\r

  \r

  ## 下载\r

  \r

  - 桌面客户端支持磁力链接、BT 种子和 HTTP/HTTPS 文件直链。\r

  - HTTP 下载支持最多 3 个任务同时下载，其余自动排队。\r

  - BT 合集支持按集数或文件选择下载，下载过程中可增减选择。\r

  - 支持暂停、继续、重试、查看节点详情和打开保存目录。\r

  - 下载完成后停止传输，首次播放后才进入影视库。\r\n"
