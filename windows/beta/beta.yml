releaseNotes: "# Marchen 1.0.3\r

  \r

  ## 弹幕\r

  \r

  - 优化繁体转简体，支持在播放时即时切换，对在线获取和本地导入的弹幕均生效。\r

  - 调整弹幕排布，顶部、底部固定弹幕可与滚动弹幕同排显示。\r

  \r

  ## 播放体验\r

  \r

  - 影视库「继续观看」展示上限由 10 部提高至 30 部。\r

  - 控制栏隐藏时，底部进度条改为半透明浅蓝色。\r\n"
