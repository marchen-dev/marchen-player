releaseNotes: "# Marchen 1.1.7\r

  \r

  ## 播放器\r

  \r

  - 控制栏更紧凑，减少对画面的遮挡。\r

  - 移除画面顶部的渐变遮罩。\r

  - 鼠标移出播放窗口时自动隐藏控制栏，移回后恢复显示。\r

  \r

  ## 窗口与设置\r

  \r

  - macOS 窗口按钮随控制栏显示和隐藏，全屏时保留系统退出全屏入口。\r

  - Windows 打开设置侧栏时隐藏右上角窗口按钮，关闭侧栏后恢复。\r

  - 设置侧栏始终保留开合动画，不再随系统“减少动态效果”设置关闭。\r\n"
