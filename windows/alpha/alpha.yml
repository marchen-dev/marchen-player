releaseNotes: "# Marchen 1.1.3\r

  \r

  ## 夜间模式\r

  \r

  - 夜间模式改为更柔和的深灰，不再是一片纯黑；页面、卡片与弹窗的层次更分明。\r

  - 开关在关闭状态下也能看清，打开后圆点保持白色；主题切换、下载筛选等分段选项的选中项更醒目；下拉框和输入框不再是厚重的黑块。\r

  - 首页、侧栏、设置与播放器弹窗统一为同一套冷灰色调，白天模式的灰色也同步调整，整体观感更一致。\r

  - 首页标志悬停变为品牌色时，播放三角显示为白色，与应用图标一致。\r

  \r

  ## 设置\r

  \r

  - 「播放内核」「API 线路」与其他设置项使用相同排版，标题与说明对齐。\r

  \r

  ## 播放\r

  \r

  - 进度条悬停预览框缩小，不再遮挡控制栏上的按钮。\r\n"
