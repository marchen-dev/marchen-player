releaseNotes: "# Marchen 1.1.9\r

  \r

  ## 播放器设置\r

  \r

  - 重新设计弹幕与字幕设置：字体大小、不透明度、弹幕速度改为滑块，可一键恢复默认；显示区域改为分段按钮。\r

  - 弹幕设置分为匹配、显示、外观、来源与规则四组，字幕设置分为字幕轨道与调整两组，更容易找到。\r

  - 移除「在屏密度」选项，同屏弹幕上限固定为 120 条。\r

  - 修复弹幕速度中「极慢」与「较慢」顺序颠倒的问题。\r

  \r

  ## 更新与媒体源\r

  \r

  - Windows 与 Linux AppImage 发现新版本后会在后台自动下载，下载完成后提示，由你决定何时安装。\r

  - 添加媒体源时服务器地址可以省略 `http://`。\r\n"
