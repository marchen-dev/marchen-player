releaseNotes: |
  # Marchen 1.1.10

  ## 播放

  - 按住右方向键可临时以 3 倍速播放，松手后恢复原倍速。短按右方向键仍可快进 5 秒。
  - 在「播放器设置 → 播放偏好」里可以查看键盘快捷键。
  - 修复兼容内核在高倍速播放时可能出现的停顿。

  ## 弹幕

  - 弹幕显示区域改用滑块调整，字号滑块的 100% 默认档位移到中央。
  - 从链接添加弹幕时，侧栏会按需滚动，让导入进度、选集控件或处理结果进入视野。
