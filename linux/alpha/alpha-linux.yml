releaseNotes: |
  # Marchen 1.1.4

  ## 弹幕

  - 优化弹幕服务的连接稳定性。

  ## 网页版

  - 手机打开网页版时会提示改用电脑访问，可复制链接分享到电脑，也可以选择仍要继续；手机上不再弹出桌面客户端推广。
  - 浏览器标签页图标去掉白色底板，在深色与浅色标签栏下都更清晰。
