releaseNotes: |
  # Marchen 1.1.6

  ## 字幕

  - 支持 MKV 内嵌的 PGS 图片字幕。
  - HDR 视频中的图片字幕会自动提亮。

  ## 网络

  - 自动线路模式下，当前线路较慢时会同时请求另一条线路，取先返回的结果。
  - 自动模式会记住更快的线路，下次优先使用。

  ## 下载

  - 下载进度显示更连贯。
