releaseNotes: |
  # Marchen 1.1.7

  ## 播放器

  - 控制栏更紧凑，减少对画面的遮挡。
  - 移除画面顶部的渐变遮罩。
  - 鼠标移出播放窗口时自动隐藏控制栏，移回后恢复显示。

  ## 窗口与设置

  - macOS 窗口按钮随控制栏显示和隐藏，全屏时保留系统退出全屏入口。
  - Windows 打开设置侧栏时隐藏右上角窗口按钮，关闭侧栏后恢复。
  - 设置侧栏始终保留开合动画，不再随系统“减少动态效果”设置关闭。
