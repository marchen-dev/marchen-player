releaseNotes: |
  # Marchen 1.1.2

  ## 全新图标

  - 应用换上新图标，macOS、Windows、Linux 与网页版统一更新；播放器首页的标志在鼠标悬停时显示品牌色。

  ## 加载

  - 加载界面字号和进度条更大，层级更清楚；读取远程视频时进度改为「已读取识别片段 N%」，不再频繁闪烁。
  - 加载失败时直接在加载界面显示原因，并按来源给出对应操作：本地文件可重新选择，远程链接可重试或更换链接，媒体源按具体原因提示重试或前往媒体源检查。

  ## 播放

  - 进度条悬停预览在新画面出来前保留上一帧，显示和消失更顺滑，预览框不再超出控制栏；拖动进度条时只显示时间。
  - 控制栏自动隐藏更快，手搭在鼠标上的轻微抖动不再唤起控制栏。

  ## 字幕

  - 播放 Jellyfin / Emby 媒体源时，字幕设置不再误报「远程视频暂不支持内嵌字幕」。
  - 修复部分 MKV 内嵌 ASS 字幕因含零时长事件导致整条字幕轨无法加载的问题。

  ## 其他

  - 修复 Windows 与 Linux 上重复打开应用或双击视频时，可能同时启动多个窗口的问题。
