releaseNotes: |
  # Marchen 1.1.8

  ## 新功能

  - 界面新增 English，默认跟随系统语言，可在「设置 → 通用」里切换。
  - 新增弹幕翻译：把中文弹幕翻译成英文，本地翻译，离线可用，在弹幕设置里开启。

  ## 修复

  - 修复调整窗口大小时弹幕被清空的问题。
