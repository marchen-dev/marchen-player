name: Build verified Web artifact

on:
  workflow_call:

jobs:
  build-web:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
      VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      MARCHEN_COMMIT: ${{ github.sha }}
      MARCHEN_DIST: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - run: git lfs checkout
      - uses: pnpm/action-setup@v4.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Validate production observability configuration
        shell: bash
        run: |
          required=(VITE_API_URL VITE_SENTRY_DSN VITE_POSTHOG_KEY VITE_POSTHOG_HOST SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then echo "Missing required Web release variable: $name" >&2; exit 1; fi
          done

      - run: pnpm install --frozen-lockfile
      - name: Resolve release name
        shell: bash
        run: echo "SENTRY_RELEASE=Marchen@$(node -p "require('./package.json').version")+$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Lint, typecheck and build Web
        run: |
          pnpm typecheck
          pnpm lint
          pnpm build:web
      - name: Verify Web bundle and Source Map removal
        run: node scripts/verify-observability-build.mjs --root out/web --target web --expected-release "$SENTRY_RELEASE" --expected-dist web --require-no-maps
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: out/web
          if-no-files-found: error
