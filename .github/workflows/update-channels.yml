name: Publish desktop update channels

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-update-channels
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      # 使用默认分支上的受控发行脚本，而非发行包中提供的可执行内容。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate and atomically publish channel feeds
        run: node scripts/desktop/publish-channels.mjs --publish
      - name: Record published release deployment
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=${RELEASE_TAG#v}
          CHANNEL=$(node --input-type=module -e 'import {parseReleaseVersion} from "./packages/shared/src/update-policy.ts"; console.log(parseReleaseVersion(process.env.RELEASE_TAG.slice(1)).channel)')
          COMMIT=$(git rev-list -n 1 "$RELEASE_TAG")
          ENVIRONMENT=$CHANNEL
          if [ "$CHANNEL" = stable ]; then ENVIRONMENT=production; fi
          npx --yes @sentry/cli@2.58.6 releases deploys "Marchen@$VERSION+$COMMIT" new -e "$ENVIRONMENT"
