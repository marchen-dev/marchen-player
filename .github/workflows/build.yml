on:
  pull_request:
  push:
    branches: [main]

name: CI Typecheck, Lint, and Build

jobs:
  build:
    name: Lint and Typecheck
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Checkout LFS objects
        run: git lfs checkout

      - uses: pnpm/action-setup@v6.1.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install

      - name: Lint and Typecheck
        run: |
          pnpm run typecheck
          pnpm run lint

      - name: Test Web release metadata with deployment environment
        env:
          # 模拟发布脚本注入值，避免测试只在无发布变量的本地环境通过。
          SENTRY_RELEASE: Marchen@0.0.0+ci-check
          MARCHEN_COMMIT: ci-check
          MARCHEN_DIST: web
          MARCHEN_ENVIRONMENT: production
        run: pnpm exec vitest run --config vitest.main.config.ts src/main/build/telemetry-metadata.test.ts scripts/web/release.test.mjs

      - name: Build project
        env:
          # PR 检查没有本地 .env；公开代理地址不依赖 secrets，fork PR 也可构建。
          VITE_API_URL: https://dandan-proxy.suemor.com/api/v2
        run: pnpm run build:web
